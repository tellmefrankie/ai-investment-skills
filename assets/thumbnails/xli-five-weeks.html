<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1000px;
    height: 420px;
    background: linear-gradient(135deg, #0a1628 0%, #0d2137 50%, #0a1628 100%);
    font-family: -apple-system, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
    position: relative;
  }

  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(#16653422 1px, transparent 1px),
      linear-gradient(90deg, #16653422 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  body::after {
    content: '';
    position: absolute;
    top: -50%;
    left: 20%;
    width: 60%;
    height: 200%;
    background: radial-gradient(ellipse, #10b98115 0%, transparent 70%);
    pointer-events: none;
  }

  .container {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    height: 100%;
    padding: 40px 52px;
  }

  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .tag {
    background: #064e3b;
    color: #6ee7b7;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 6px 14px;
    border-radius: 6px;
    border: 1px solid #10b98140;
  }

  .weeks-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .week-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #10b981;
  }

  .week-dot.dim {
    background: #065f46;
    border: 1px solid #10b98150;
  }

  .week-label {
    font-size: 11px;
    color: #86efac;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-left: 4px;
  }

  .middle {
    flex: 1;
    display: flex;
    align-items: center;
    padding: 20px 0;
  }

  .title {
    font-size: 34px;
    font-weight: 800;
    color: #f0fdf4;
    line-height: 1.25;
    max-width: 820px;
    letter-spacing: -0.02em;
  }

  .title em {
    color: #34d399;
    font-style: normal;
  }

  .subtitle {
    font-size: 18px;
    color: #86efac;
    line-height: 1.5;
    margin-top: 12px;
    max-width: 720px;
  }

  .stats-row {
    display: flex;
    gap: 32px;
    margin-top: 20px;
  }

  .stat {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .stat-value {
    font-size: 24px;
    font-weight: 800;
    color: #34d399;
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }

  .stat-label {
    font-size: 11px;
    color: #86efac60;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .author {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .author-dot {
    width: 8px;
    height: 8px;
    background: #10b981;
    border-radius: 50%;
  }

  .author-name {
    font-size: 14px;
    color: #86efac;
    font-weight: 500;
  }

  .accent-line {
    width: 48px;
    height: 3px;
    background: linear-gradient(90deg, #10b981, transparent);
    border-radius: 2px;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="top">
      <div class="tag">#Options Flow</div>
      <div class="weeks-row">
        <div class="week-dot"></div>
        <div class="week-dot"></div>
        <div class="week-dot"></div>
        <div class="week-dot"></div>
        <div class="week-dot"></div>
        <div class="week-label">5 weeks straight</div>
      </div>
    </div>
    <div class="middle">
      <div>
        <div class="title">My AI scanner flagged <em>XLI</em> for 5 weeks straight</div>
        <div class="subtitle">P/C 3.1 → 4.1 → 4.6 → 4.9 → 5.32. When do you finally listen?</div>
        <div class="stats-row">
          <div class="stat">
            <div class="stat-value">5.32</div>
            <div class="stat-label">Peak P/C ratio</div>
          </div>
          <div class="stat">
            <div class="stat-value">-4.1%</div>
            <div class="stat-label">vs SPX after signal</div>
          </div>
          <div class="stat">
            <div class="stat-value">6.1</div>
            <div class="stat-label">Adjusted (lottery filtered)</div>
          </div>
        </div>
      </div>
    </div>
    <div class="bottom">
      <div class="author">
        <div class="author-dot"></div>
        <div class="author-name">tellmefrankie · dev.to</div>
      </div>
      <div class="accent-line"></div>
    </div>
  </div>
</body>
</html>
